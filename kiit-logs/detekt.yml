build:
  maxIssues: 0

config:
  validation: true
  warningsAsErrors: false

style:
  MaxLineLength:
    maxLineLength: 120
  WildcardImport:
    active: true
  ReturnCount:
    max: 6               # guard-clause early returns are idiomatic; default of 2 is too strict
  ForbiddenComment:
    active: false        # TODOs in KDoc are used as design notes, not untracked work

complexity:
  TooManyFunctions:
    # LogSupport is a deliberately wide interface: debug/info/warn/error/fatal, each with message,
    # exception, key-value and lazy variants. That breadth is the API, not a smell to split up.
    thresholdInInterfaces: 50
