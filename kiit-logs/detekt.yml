build:
  maxIssues: 0

config:
  validation: true
  warningsAsErrors: false

style:
  MaxLineLength:
    maxLineLength: 140   # same as ktlint, which formats lines up to 140
  WildcardImport:
    active: true
  ReturnCount:
    max: 6               # guard-clause early returns are idiomatic; default of 2 is too strict
  ForbiddenComment:
    active: false        # TODOs in KDoc are used as design notes, not untracked work

complexity:
  TooManyFunctions:
    # Logger has a method for each level, for a LogData and for a lambda that makes one, plus the general
    # log methods. That breadth is the API, not a smell to split up.
    thresholdInClasses: 30
    thresholdInInterfaces: 50
