name: CI

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: ktlint
        run: ./gradlew :kiit-logs:ktlintCheck

      - name: detekt
        run: ./gradlew :kiit-logs:detekt

      - name: JVM tests (commonTest)
        run: ./gradlew :kiit-logs:jvmTest

      # Runs commonTest on Android, on the JVM. The ubuntu runner has the Android SDK.
      - name: Android unit tests (commonTest)
        run: ./gradlew :kiit-logs:testDebugUnitTest

      # Compiles the sample against the library, so an API change can't break it unnoticed.
      - name: Sample build
        run: ./gradlew :samples:sample-kotlin:build

  apple-checks:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      # SKIE's Swift-side compile step needs Xcode/swiftc/xcrun, not just Gradle — a macOS
      # runner, same requirement every other kiit KMP module needs.
      - name: iOS simulator tests (commonTest)
        run: ./gradlew :kiit-logs:iosSimulatorArm64Test

      - name: macOS tests (commonTest)
        run: ./gradlew :kiit-logs:macosArm64Test

      # macOS is the only runner that builds the Apple publications, so this packages every
      # target. Signing is skipped for Maven local, no key is needed.
      - name: Package check (publishToMavenLocal)
        run: ./gradlew :kiit-logs:publishToMavenLocal
